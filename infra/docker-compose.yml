services:
  trip-service:
    build:
      context: ..
      dockerfile: ./services/trip-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://wayfinder:123456@postgredb:5432/tripdb?schema=public
      NODE_ENV: production
      PORT: "50051"
    depends_on:
      postgredb:
        condition: service_healthy
    ports:
      - "50051:50051"
    networks:
      - wayfinder-network

  user-service:
    build:
      context: ..
      dockerfile: ./services/.NET/Wayfinder.UserService/Wayfinder.UserService.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TripDb;User Id=sa;Password=Password@12345;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
       sqlserver:
         condition: service_healthy
    restart: unless-stopped
    ports:
      - "5001:8080" # localhost:5001 → container:8080 (HTTP)
    networks:
      - wayfinder-network

  auth-service:
    build:
      context: ..
      dockerfile: ./services/.NET/Wayfinder.AuthService/Wayfinder.AuthService.Api/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TripDb;User Id=sa;Password=Password@12345;TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
       sqlserver:
         condition: service_healthy
    restart: unless-stopped
    ports:
      - "5002:8080" # localhost:5001 → container:8080 (HTTP)
    networks:
      - wayfinder-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      - "ACCEPT_EULA=Y"
      - "MSSQL_SA_PASSWORD=Password@12345"
      # This tells the container to create this database on its first startup.
      - "MSSQL_DB=TripPlannerDb"
    ports:
      - "1433:1433"
    networks:
      - wayfinder-network
    volumes:
      - sql_data:/var/opt/mssql
      - ../scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 'localhost' -U 'sa' -P 'Password@12345' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgredb:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wayfinder
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tripdb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - wayfinder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfinder -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
  sql_data:

networks:
  wayfinder-network:
    driver: bridge
